regions:
  - ap-south-1
  - global  # Required for IAM, Route53, CloudFront, etc.

blocklist:
  - "959782869917"  # ← REPLACE with your MANAGEMENT (root/parent) account ID
                    #   This prevents aws-nuke from ever running on your org's master account

accounts:
  "275023965684":
    alias: "lab-student01"   # ← REPLACE with your CHILD account ID
    filters:

      # ---------------------------------------------------------------
      # Preserve the OrganizationAccountAccessRole (used by the parent
      # account to assume into this child account via AWS Organizations)
      # ---------------------------------------------------------------
      IAMRole:
        - "OrganizationAccountAccessRole"

      IAMRolePolicyAttachment:
        - "OrganizationAccountAccessRole -> AdministratorAccess"

      IAMRolePolicy:          # inline policies on that role (if any)
        - property: role
          value: "OrganizationAccountAccessRole"

      # ---------------------------------------------------------------
      # Preserve IAM user 'Coder' and its login profile
      # ---------------------------------------------------------------
      IAMUser:
        - "Coder"

      IAMUserLoginProfile:
        - "Coder"

      # Keep any access keys, group memberships, and policies attached
      # to 'Coder' so the account remains usable after the nuke

# ---------------------------------------------------------------
# Resource-type blocklist (optional safety net)
# Uncomment any line to completely skip that resource type globally
# ---------------------------------------------------------------
resource-types:
  excludes:
    # - S3Object          # Uncomment if you want to keep S3 objects
    # - Route53HostedZone # Uncomment to keep DNS zones
