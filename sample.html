<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe Example</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .header {
            padding: 15px;
            background: #222;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .iframe-container {
            width: 100%;
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <div class="header">
        Embedded Page - 10.0.0.11
    </div>

    <div class="iframe-container">
        <iframe
            src="http://10.0.117.122"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
